# ==============================================================================
# .github/workflows/deploy.yml
# L-MOD Vault: GitHub Actions 生产环境自动化测试、构建与 GitHub Pages 部署流水线
# ==============================================================================
name: Deploy L-MOD Vault to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_validate:
    name: 🏗️ Quality Gate & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: ""

      - name: 🌐 Run i18n & DOM Verification Gate
        run: |
          python3 scripts/verify_i18n_dual_pages.py

      - name: ⚙️ Run Production Build & Cloudflare/Pages Artifact Generation
        run: |
          python3 scripts/build_prod.py

      - name: 🩺 Run Deployment Health Check & Flagship Games Audit
        run: |
          python3 scripts/verify_deployment.py

      - name: 📦 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_validate
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
